# Runs the hub behind the shared caddy-docker-proxy on the Oracle server.
# The proxy watches the external `web` network and issues HTTPS automatically.
name: hub
services:
  hub:
    build: ..
    restart: unless-stopped
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - hub-data:/data
    networks: [web]
    labels:
      caddy_0: ${HUB_HOST:-shimonr.com}
      caddy_0.reverse_proxy: '{{upstreams 8080}}'
      caddy_0.encode: zstd gzip
      # www and the old sslip.io address redirect to the main domain
      caddy_1: www.${HUB_HOST:-shimonr.com} hub.129-159-8-242.sslip.io
      caddy_1.redir: https://${HUB_HOST:-shimonr.com}{uri} permanent

volumes:
  hub-data:

networks:
  web:
    external: true
